<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacienți — Ana Ghimiciu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6F0;
    --surface: #FFFFFF;
    --border: #E8DDD0;
    --text: #2E2A26;
    --text-muted: #7A7168;
    --text-faint: #B0A692;
    --green: #3F5B47;
    --green-soft: #EAF0E8;
    --terracotta: #A8664F;
    --terracotta-soft: #F3E6DE;
    --slate: #4A5A6B;
    --slate-soft: #E8ECF0;
    --taupe: #8C7355;
    --taupe-soft: #EFEAE3;
    --danger: #B23A3A;
    --danger-soft: #F5E4E1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 580px; margin: 0 auto; padding: 52px 20px 60px 20px; }

  /* login */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
  .login-card { background: var(--surface); border-radius: 18px; padding: 36px 30px; max-width: 340px; width: 100%; text-align: center; box-shadow: 0 1px 3px rgba(60,45,30,0.04), 0 12px 32px -16px rgba(60,45,30,0.14); }
  .login-card h2 { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; margin: 0 0 20px 0; }
  input[type="password"], input[type="text"], input[type="url"], select {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; background: #fff; color: var(--text); font-family: 'Inter', sans-serif;
  }
  button { font-family: 'Inter', sans-serif; cursor: pointer; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; padding: 11px 18px; }
  .btn-primary { background: var(--green); color: var(--bg); width: 100%; margin-top: 12px; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  /* app */
  #app-screen { display: none; }
  .eyebrow { font-size: 13px; color: var(--terracotta); font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .eyebrow .rule { width: 20px; height: 1px; background: var(--terracotta); }
  h1 { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 600; margin: 0 0 10px 0; letter-spacing: -0.01em; line-height: 1.2; }
  .subtitle { color: var(--text-muted); font-size: 14.5px; margin: 0 0 26px 0; max-width: 400px; }

  .search-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .search { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 15px; font-size: 14px; }
  .btn-add { background: var(--green); color: var(--bg); white-space: nowrap; }

  .card { background: var(--surface); border-radius: 16px; padding: 4px 22px; box-shadow: 0 1px 3px rgba(60,45,30,0.04), 0 12px 32px -16px rgba(60,45,30,0.10); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #F1E9DE; position: relative; }
  .row:last-child { border-bottom: none; }
  .row-left { display: flex; align-items: center; gap: 14px; cursor: pointer; flex: 1; min-width: 0; }
  .row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0; }
  .name { font-size: 15px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 20px; flex-shrink: 0; }
  .badge.trio { background: var(--green-soft); color: var(--green); }
  .badge.loop { background: var(--terracotta-soft); color: var(--terracotta); }
  .badge.aaps { background: var(--slate-soft); color: var(--slate); }
  .badge.other { background: var(--taupe-soft); color: var(--taupe); }
  .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px 0; }

  .kebab { width: 28px; height: 28px; border-radius: 8px; background: transparent; color: var(--text-faint); font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0; }
  .kebab:hover { background: #F3ECE1; color: var(--text-muted); }
  .kebab-menu {
    display: none; position: absolute; right: 0; top: 42px; z-index: 5;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 24px -8px rgba(60,45,30,0.22); min-width: 130px;
  }
  .kebab-menu.open { display: block; }
  .kebab-menu button { width: 100%; text-align: left; background: none; border-radius: 0; padding: 10px 14px; font-size: 13.5px; color: var(--text); }
  .kebab-menu button:hover { background: #F7F2EA; }
  .kebab-menu button.danger { color: var(--danger); }

  /* modal */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(46,42,38,0.35); align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal { background: var(--surface); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; }
  .modal h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 0 0 18px 0; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
  .field .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-secondary { background: #F3ECE1; color: var(--text-muted); flex: 1; }
  .modal-actions .btn-primary { flex: 1; margin-top: 0; }
  .modal p.confirm-text { font-size: 14.5px; color: var(--text); margin: 0 0 4px 0; }
  .btn-danger { background: var(--danger); color: #fff; flex: 1; }
</style>
</head>
<body>

  <div id="login-screen" class="wrap">
    <div class="login-card">
      <h2>Pacienți</h2>
      <input type="password" id="password-input" placeholder="Parolă" autofocus>
      <button class="btn-primary" id="login-btn">Intră</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <div id="app-screen" class="wrap">
    <div class="eyebrow"><span class="rule"></span>Pentru Ana</div>
    <h1>Pacienții dumneavoastră,<br>la un click distanță.</h1>
    <p class="subtitle">Click pe un pacient deschide situația lui în Nightscout.</p>

    <div class="search-row">
      <input class="search" id="search-input" placeholder="Caută pacient…">
      <button class="btn-add" id="add-btn">+ Adaugă</button>
    </div>

    <div class="card">
      <div id="patient-list"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2 id="modal-title">Pacient nou</h2>
      <input type="hidden" id="f-id">
      <div class="field">
        <label>Nume</label>
        <input type="text" id="f-name" placeholder="Ex: Ioana Popescu">
      </div>
      <div class="field">
        <label>Link Nightscout</label>
        <input type="url" id="f-url" placeholder="https://exemplu.nightscoutpro.com/">
      </div>
      <div class="field">
        <label>Access Token (opțional)</label>
        <input type="text" id="f-token" placeholder="dr-xxxxxxxxxxxxxxxx">
        <div class="hint">Lasă gol dacă nu ai un token — se deschide direct linkul.</div>
      </div>
      <div class="field">
        <label>Sistem</label>
        <select id="f-os">
          <option value="Trio">Trio</option>
          <option value="Loop">Loop</option>
          <option value="AAPS">AAPS</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="error-msg" id="form-error"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-btn">Anulează</button>
        <button class="btn-primary" id="save-btn">Salvează</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="delete-backdrop">
    <div class="modal">
      <h2>Ștergi pacientul?</h2>
      <p class="confirm-text">Sigur vrei să ștergi <strong id="delete-name"></strong>? Nu se poate anula.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="delete-cancel-btn">Anulează</button>
        <button class="btn-danger" id="delete-confirm-btn">Șterge</button>
      </div>
    </div>
  </div>

<script>
  let PASSWORD = sessionStorage.getItem('ns_app_pw') || '';
  let PATIENTS = [];
  let openMenuId = null;
  let pendingDeleteId = null;

  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const passwordInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const patientList = document.getElementById('patient-list');
  const searchInput = document.getElementById('search-input');
  const addBtn = document.getElementById('add-btn');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalTitle = document.getElementById('modal-title');
  const cancelBtn = document.getElementById('cancel-btn');
  const saveBtn = document.getElementById('save-btn');
  const formError = document.getElementById('form-error');
  const deleteBackdrop = document.getElementById('delete-backdrop');
  const deleteName = document.getElementById('delete-name');
  const deleteCancelBtn = document.getElementById('delete-cancel-btn');
  const deleteConfirmBtn = document.getElementById('delete-confirm-btn');

  function sysKey(os) {
    if (os === 'Loop') return 'loop';
    if (os === 'AAPS') return 'aaps';
    if (os === 'Other') return 'other';
    return 'trio';
  }
  const avatarColors = { trio: '#3F5B47', loop: '#A8664F', aaps: '#4A5A6B', other: '#8C7355' };

  function initials(name) {
    return name.split(' ').filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('');
  }

  function openPatient(p) {
    if (!p.token) { window.open(p.url, '_blank'); return; }
    const sep = p.url.includes('?') ? '&' : '?';
    window.open(p.url + sep + 'token=' + encodeURIComponent(p.token), '_blank');
  }

  function closeAllMenus() {
    document.querySelectorAll('.kebab-menu').forEach(m => m.classList.remove('open'));
    openMenuId = null;
  }

  function renderPatients() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = PATIENTS.filter(p => p.name.toLowerCase().includes(q));
    patientList.innerHTML = '';
    if (!filtered.length) {
      patientList.innerHTML = `<div class="empty-state">${PATIENTS.length ? 'Niciun rezultat.' : 'Niciun pacient adăugat încă.'}</div>`;
      return;
    }
    filtered.forEach(p => {
      const key = sysKey(p.os);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="row-left" data-action="open">
          <div class="avatar" style="background:${avatarColors[key]};">${initials(p.name)}</div>
          <div class="name">${p.name}</div>
        </div>
        <div class="row-right">
          <span class="badge ${key}">${p.os}</span>
          <button class="kebab" data-action="menu">⋯</button>
          <div class="kebab-menu" data-menu>
            <button data-action="edit">Editează</button>
            <button data-action="delete" class="danger">Șterge</button>
          </div>
        </div>
      `;
      row.querySelector('[data-action="open"]').addEventListener('click', () => openPatient(p));
      const menu = row.querySelector('[data-menu]');
      row.querySelector('[data-action="menu"]').addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = menu.classList.contains('open');
        closeAllMenus();
        if (!wasOpen) { menu.classList.add('open'); openMenuId = p.id; }
      });
      row.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
        e.stopPropagation();
        closeAllMenus();
        openEditModal(p);
      });
      row.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
        e.stopPropagation();
        closeAllMenus();
        pendingDeleteId = p.id;
        deleteName.textContent = p.name;
        deleteBackdrop.style.display = 'flex';
      });
      patientList.appendChild(row);
    });
  }

  document.addEventListener('click', closeAllMenus);

  async function loadPatients() {
    const res = await fetch('/api/patients', { headers: { 'x-app-password': PASSWORD } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    PATIENTS = data.patients || [];
    renderPatients();
  }

  function logout() {
    sessionStorage.removeItem('ns_app_pw');
    PASSWORD = '';
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  }

  async function tryLogin() {
    const pw = passwordInput.value;
    loginError.textContent = '';
    loginBtn.disabled = true;
    const res = await fetch('/api/patients', { headers: { 'x-app-password': pw } });
    loginBtn.disabled = false;
    if (res.status === 401) { loginError.textContent = 'Parolă greșită.'; return; }
    PASSWORD = pw;
    sessionStorage.setItem('ns_app_pw', pw);
    const data = await res.json();
    PATIENTS = data.patients || [];
    renderPatients();
    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
  }

  loginBtn.addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  searchInput.addEventListener('input', renderPatients);

  function openAddModal() {
    modalTitle.textContent = 'Pacient nou';
    document.getElementById('f-id').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-token').value = '';
    document.getElementById('f-os').value = 'Trio';
    formError.textContent = '';
    modalBackdrop.style.display = 'flex';
  }

  function openEditModal(p) {
    modalTitle.textContent = 'Editează pacient';
    document.getElementById('f-id').value = p.id;
    document.getElementById('f-name').value = p.name;
    document.getElementById('f-url').value = p.url;
    document.getElementById('f-token').value = p.token || '';
    document.getElementById('f-os').value = p.os;
    formError.textContent = '';
    modalBackdrop.style.display = 'flex';
  }

  addBtn.addEventListener('click', openAddModal);
  cancelBtn.addEventListener('click', () => { modalBackdrop.style.display = 'none'; });

  saveBtn.addEventListener('click', async () => {
    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    const token = document.getElementById('f-token').value.trim();
    const os = document.getElementById('f-os').value;
    if (!name || !url) { formError.textContent = 'Completează numele și linkul.'; return; }
    saveBtn.disabled = true;
    let res;
    if (id) {
      res = await fetch('/api/patients/' + encodeURIComponent(id), {
        method: 'PUT',
        headers: { 'x-app-password': PASSWORD, 'content-type': 'application/json' },
        body: JSON.stringify({ name, url, token, os })
      });
    } else {
      res = await fetch('/api/patients', {
        method: 'POST',
        headers: { 'x-app-password': PASSWORD, 'content-type': 'application/json' },
        body: JSON.stringify({ name, url, token, os })
      });
    }
    saveBtn.disabled = false;
    if (!res.ok) { formError.textContent = 'A apărut o eroare. Încearcă din nou.'; return; }
    modalBackdrop.style.display = 'none';
    loadPatients();
  });

  deleteCancelBtn.addEventListener('click', () => { deleteBackdrop.style.display = 'none'; pendingDeleteId = null; });
  deleteConfirmBtn.addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    deleteConfirmBtn.disabled = true;
    const res = await fetch('/api/patients/' + encodeURIComponent(pendingDeleteId), {
      method: 'DELETE',
      headers: { 'x-app-password': PASSWORD }
    });
    deleteConfirmBtn.disabled = false;
    deleteBackdrop.style.display = 'none';
    pendingDeleteId = null;
    if (res.ok) loadPatients();
  });

  if (PASSWORD) {
    fetch('/api/patients', { headers: { 'x-app-password': PASSWORD } })
      .then(res => { if (res.status === 401) { logout(); return null; } return res.json(); })
      .then(data => {
        if (data) {
          PATIENTS = data.patients || [];
          renderPatients();
          loginScreen.style.display = 'none';
          appScreen.style.display = 'block';
        }
      });
  }
</script>
</body>
</html>
