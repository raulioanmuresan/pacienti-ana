<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacienți Trio &amp; Loop — Ana Ghimiciu</title>
<style>
  :root {
    --bg: #F5F7F1;
    --surface: #FFFFFF;
    --border: #E3E8DE;
    --text: #202A22;
    --text-muted: #5C6B5B;
    --amber: #E19A2E;
    --amber-soft: #FBF0DC;
    --sage: #2F7A5E;
    --sage-soft: #E6F1EA;
    --loop-bg: #EAF1FB;
    --loop-text: #2557A7;
    --trio-bg: #EAF7F0;
    --trio-text: #1C7A4D;
    --danger: #C0402F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px 60px 20px;
  }
  header {
    margin-bottom: 28px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 13.5px;
    margin: 0;
  }

  /* login */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .login-card h2 {
    font-size: 17px;
    margin: 0 0 18px 0;
  }
  input[type="password"], input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
  }
  .btn-primary {
    background: var(--sage);
    color: #fff;
    width: 100%;
    margin-top: 12px;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .error-msg {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* app */
  #app-screen { display: none; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .btn-add {
    background: var(--sage-soft);
    color: var(--sage);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 20px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--amber-soft); margin: 0 -20px; padding: 13px 20px; border-radius: 8px; }
  .row-left { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #EDF0E9; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .name { font-size: 14.5px; font-weight: 500; }
  .badge {
    font-size: 10.5px; font-weight: 650;
    padding: 2px 9px; border-radius: 20px;
    margin-left: 12px;
  }
  .badge.loop { background: var(--loop-bg); color: var(--loop-text); }
  .badge.trio { background: var(--trio-bg); color: var(--trio-text); }
  .arrow { color: var(--text-muted); font-size: 15px; }
  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 30px 0;
  }

  /* modal */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,26,20,0.4);
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    padding: 28px;
    max-width: 380px;
    width: 100%;
  }
  .modal h2 { font-size: 17px; margin: 0 0 18px 0; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 600;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn-secondary {
    background: var(--bg);
    color: var(--text-muted);
    flex: 1;
  }
  .modal-actions .btn-primary { flex: 1; margin-top: 0; }
</style>
</head>
<body>

  <div id="login-screen" class="wrap">
    <div class="login-card">
      <h2>Pacienți Trio &amp; Loop</h2>
      <input type="password" id="password-input" placeholder="Parolă" autofocus>
      <button class="btn-primary" id="login-btn">Intră</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <div id="app-screen" class="wrap">
    <header>
      <h1>Pacienți Trio &amp; Loop</h1>
      <p class="subtitle">Pentru Ana Ghimiciu — click pe un pacient deschide situația lui în Nightscout</p>
    </header>
    <div class="toolbar">
      <span></span>
      <button class="btn-add" id="add-btn">+ Adaugă pacient</button>
    </div>
    <div class="card">
      <div id="patient-list"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
      <h2>Pacient nou</h2>
      <div class="field">
        <label>Nume</label>
        <input type="text" id="f-name" placeholder="Ex: Ioana Popescu">
      </div>
      <div class="field">
        <label>Link Nightscout</label>
        <input type="url" id="f-url" placeholder="https://exemplu.nightscoutpro.com/">
      </div>
      <div class="field">
        <label>Access Token (readable)</label>
        <input type="text" id="f-token" placeholder="dr-xxxxxxxxxxxxxxxx">
      </div>
      <div class="field">
        <label>Sistem</label>
        <select id="f-os">
          <option value="Trio">Trio</option>
          <option value="Loop">Loop</option>
        </select>
      </div>
      <div class="error-msg" id="form-error"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-btn">Anulează</button>
        <button class="btn-primary" id="save-btn">Salvează</button>
      </div>
    </div>
  </div>

<script>
  let PASSWORD = sessionStorage.getItem('ns_app_pw') || '';

  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const passwordInput = document.getElementById('password-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const patientList = document.getElementById('patient-list');
  const addBtn = document.getElementById('add-btn');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const cancelBtn = document.getElementById('cancel-btn');
  const saveBtn = document.getElementById('save-btn');
  const formError = document.getElementById('form-error');

  function initials(name) {
    return name.split(' ').filter(Boolean).slice(0,2).map(p => p[0].toUpperCase()).join('');
  }

  function openPatient(p) {
    const sep = p.url.includes('?') ? '&' : '?';
    window.open(p.url + sep + 'token=' + encodeURIComponent(p.token), '_blank');
  }

  function renderPatients(patients) {
    patientList.innerHTML = '';
    if (!patients.length) {
      patientList.innerHTML = '<div class="empty-state">Niciun pacient adăugat încă.</div>';
      return;
    }
    patients.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="row-left">
          <div class="avatar">${initials(p.name)}</div>
          <div class="name">${p.name}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <span class="badge ${p.os === 'Loop' ? 'loop' : 'trio'}">${p.os}</span>
          <span class="arrow">›</span>
        </div>
      `;
      row.addEventListener('click', () => openPatient(p));
      patientList.appendChild(row);
    });
  }

  async function loadPatients() {
    const res = await fetch('/api/patients', {
      headers: { 'x-app-password': PASSWORD }
    });
    if (res.status === 401) {
      logout();
      return;
    }
    const data = await res.json();
    renderPatients(data.patients || []);
  }

  function showApp() {
    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
    loadPatients();
  }

  function logout() {
    sessionStorage.removeItem('ns_app_pw');
    PASSWORD = '';
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
  }

  async function tryLogin() {
    const pw = passwordInput.value;
    loginError.textContent = '';
    loginBtn.disabled = true;
    const res = await fetch('/api/patients', {
      headers: { 'x-app-password': pw }
    });
    loginBtn.disabled = false;
    if (res.status === 401) {
      loginError.textContent = 'Parolă greșită.';
      return;
    }
    PASSWORD = pw;
    sessionStorage.setItem('ns_app_pw', pw);
    const data = await res.json();
    renderPatients(data.patients || []);
    loginScreen.style.display = 'none';
    appScreen.style.display = 'block';
  }

  loginBtn.addEventListener('click', tryLogin);
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

  addBtn.addEventListener('click', () => {
    formError.textContent = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-token').value = '';
    document.getElementById('f-os').value = 'Trio';
    modalBackdrop.style.display = 'flex';
  });
  cancelBtn.addEventListener('click', () => { modalBackdrop.style.display = 'none'; });

  saveBtn.addEventListener('click', async () => {
    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    const token = document.getElementById('f-token').value.trim();
    const os = document.getElementById('f-os').value;
    if (!name || !url || !token) {
      formError.textContent = 'Completează toate câmpurile.';
      return;
    }
    saveBtn.disabled = true;
    const res = await fetch('/api/patients', {
      method: 'POST',
      headers: { 'x-app-password': PASSWORD, 'content-type': 'application/json' },
      body: JSON.stringify({ name, url, token, os })
    });
    saveBtn.disabled = false;
    if (!res.ok) {
      formError.textContent = 'A apărut o eroare. Încearcă din nou.';
      return;
    }
    modalBackdrop.style.display = 'none';
    loadPatients();
  });

  // auto-login if password already remembered this session
  if (PASSWORD) {
    fetch('/api/patients', { headers: { 'x-app-password': PASSWORD } })
      .then(res => {
        if (res.status === 401) { logout(); return null; }
        return res.json();
      })
      .then(data => {
        if (data) {
          renderPatients(data.patients || []);
          showApp();
        }
      });
  }
</script>
</body>
</html>
